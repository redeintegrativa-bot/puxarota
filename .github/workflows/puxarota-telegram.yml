name: PuxaRota para Genésio Telegram
on:
  workflow_dispatch:
    inputs:
      action:
        description: Ação administrativa recebida do Genésio
        required: false
        type: choice
        options: [approve, archive]
      profile_id:
        description: UUID do perfil PuxaRota
        required: false
        type: string
  schedule:
    - cron: '*/5 * * * *'
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/notify_telegram.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUXAROTA_ACTION: ${{ inputs.action }}
          PUXAROTA_PROFILE_ID: ${{ inputs.profile_id }}
