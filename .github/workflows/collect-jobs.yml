name: Coletar oportunidades de agregamento
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: write
concurrency:
  group: collect-jobs
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Testar coletor
        run: python -m unittest discover -s tests -v
      - name: Coletar fontes públicas
        run: python collector.py
      - name: Enviar novas oportunidades para revisão administrativa
        run: |
          python collector.py --include-review --output /tmp/puxarota-review-candidates.json
          node scripts/sync_opportunity_review_queue.mjs jobs.json /tmp/puxarota-review-candidates.json job-sources.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Publicar feed atualizado
        run: |
          if git diff --quiet -- jobs.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git commit -m "chore: atualizar oportunidades"
          git push
