name: Coletar oportunidades de agregamento
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
permissions:
  contents: write
concurrency:
  group: collect-jobs
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar coletor
        run: python -m unittest discover -s tests -v
      - name: Coletar fontes públicas
        run: python collector.py
      - name: Publicar feed atualizado
        run: |
          if git diff --quiet -- jobs.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git commit -m "chore: atualizar oportunidades"
          git push
