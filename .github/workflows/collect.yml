name: Collect Opportunities

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:  # manual trigger

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run collector
        run: python collector.py --include-review

      - name: Sync to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync_opportunity_review_queue.mjs jobs.json jobs.json job-sources.json

      - name: Commit updated jobs.json
        run: |
          git config user.name "PuxaRota Bot"
          git config user.email "bot@puxarota.com.br"
          git add jobs.json
          git diff --cached --quiet || git commit -m "auto: update jobs.json [skip ci]" && git push
